# Cortex LLM model routing configuration
#
# Maps task types to preferred models. The LLM router reads this at startup.
# Change provider here without touching code.
#
# Model strings follow LiteLLM convention:
#   OpenAI:     gpt-4o, gpt-4o-mini
#   Anthropic:  claude-opus-4-5, claude-sonnet-4-6
#   Azure:      azure/gpt-4o (requires AZURE_OPENAI_* env vars)
#   Bedrock:    bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
#   Vertex:     vertex_ai/gemini-1.5-pro
#   Ollama:     ollama/llama3.1 (local, no API key needed)

routing:
  # High-stakes tasks — use the best available model
  planning:
    primary: gpt-4o
    fallback: claude-sonnet-4-6
    temperature: 0.0
    max_tokens: 2048

  # Tool-calling / execution — fast and cheap is fine
  execution:
    primary: gpt-4o-mini
    fallback: gpt-4o
    temperature: 0.0
    max_tokens: 4096

  # Quality gating — use a capable model for reliable scoring
  critic:
    primary: gpt-4o
    fallback: claude-sonnet-4-6
    temperature: 0.0
    max_tokens: 1024

  # Synthesis / summarisation — moderate quality needed
  synthesis:
    primary: gpt-4o-mini
    fallback: gpt-4o
    temperature: 0.2
    max_tokens: 2048

  # Evaluation / Ragas judge
  evaluation:
    primary: gpt-4o
    fallback: gpt-4o
    temperature: 0.0
    max_tokens: 512

embeddings:
  model: text-embedding-3-large
  dimensions: 3072
  batch_size: 20

# Cost per 1K tokens (USD) — used for budget estimation before calling the API
# Keep this in sync with actual provider pricing
cost_per_1k_tokens:
  gpt-4o:
    input: 0.0025
    output: 0.010
  gpt-4o-mini:
    input: 0.00015
    output: 0.0006
  claude-sonnet-4-6:
    input: 0.003
    output: 0.015
  text-embedding-3-large:
    input: 0.00013
    output: 0.0
