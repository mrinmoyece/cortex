apiVersion: v1
kind: Namespace
metadata:
  name: cortex

---
apiVersion: v1
kind: Service
metadata:
  name: cortex-api
  namespace: cortex
  labels:
    app: cortex
    component: api
spec:
  selector:
    app: cortex
    component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-ingress
  namespace: cortex
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - host: cortex.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortex-api
                port:
                  number: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
  namespace: cortex
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"
  QDRANT_URL: "http://qdrant:6333"
  REDIS_URL: "redis://redis:6379/0"
  DATABASE_URL: "postgresql+asyncpg://cortex:cortex@postgres:5432/cortex"
  OTEL_EXPORTER_ENDPOINT: "http://phoenix:4317"
  PHOENIX_ENDPOINT: "http://phoenix:6006"
  GUARDRAILS_ENABLED: "true"
  PII_DETECTION_ENABLED: "true"
  INJECTION_DETECTION_ENABLED: "true"
  MAX_COST_PER_RUN_USD: "2.00"

---
# Secret values — in production, inject from AWS Secrets Manager / Azure Key Vault
# NEVER commit actual secret values to git
apiVersion: v1
kind: Secret
metadata:
  name: cortex-secrets
  namespace: cortex
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_RANDOM_32_CHAR_STRING"
  OPENAI_API_KEY: "REPLACE_WITH_KEY"
  ANTHROPIC_API_KEY: "REPLACE_WITH_KEY"
  COHERE_API_KEY: "REPLACE_WITH_KEY"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cortex-api-pdb
  namespace: cortex
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cortex
      component: api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cortex-api-hpa
  namespace: cortex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cortex-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
