apiVersion: v1
kind: Namespace
metadata:
  name: cortex

---
apiVersion: v1
kind: Service
metadata:
  name: cortex-api
  namespace: cortex
  labels:
    app: cortex
    component: api
spec:
  selector:
    app: cortex
    component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-ingress
  namespace: cortex
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # /metrics is served on the same port as the API and carries model names,
    # spend totals and run volumes. The pod annotations below let Prometheus
    # scrape it in-cluster; nothing should reach it from the internet, and a
    # "/" prefix rule otherwise publishes it along with everything else.
    nginx.ingress.kubernetes.io/server-snippet: |
      location /metrics {
        deny all;
        return 403;
      }
spec:
  rules:
    - host: cortex.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortex-api
                port:
                  number: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
  namespace: cortex
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "1"
  QDRANT_URL: "http://qdrant:6333"
  REDIS_URL: "redis://redis:6379/0"
  OTEL_EXPORTER_ENDPOINT: "http://phoenix:4317"
  PHOENIX_ENDPOINT: "http://phoenix:6006"
  GUARDRAILS_ENABLED: "true"
  PII_DETECTION_ENABLED: "true"
  INJECTION_DETECTION_ENABLED: "true"
  MAX_COST_PER_RUN_USD: "2.00"
  # Off by default: execute_code runs a subprocess in the API container with
  # no kernel-level isolation. See docs/LIMITATIONS.md before enabling it.
  CODE_EXECUTION_ENABLED: "false"

---
# Secret values — in production, inject from AWS Secrets Manager / Azure Key Vault
# NEVER commit actual secret values to git
apiVersion: v1
kind: Secret
metadata:
  name: cortex-secrets
  namespace: cortex
type: Opaque
# Create this Secret from a managed secret store before applying the
# workloads; no predictable JWT signing key is supplied by this manifest.
stringData: {}
  # METRICS_TOKEN is deliberately NOT set here.
  #
  # These manifests scrape with the `prometheus.io/scrape` pod annotations,
  # and annotation-based scraping sends no credential. Shipping a token in
  # this Secret therefore did not secure anything - it broke the scrape. The
  # metrics endpoint would 401 every request, the dashboards would go blank,
  # and the first person to debug it would remove the token, which is the
  # state we are in anyway, arrived at slowly.
  #
  # What protects it in these manifests is the ingress rule above, which
  # refuses /metrics from outside the cluster. Anything already inside the
  # cluster can still reach it; restricting that needs a NetworkPolicy,
  # which is not shipped here because an untested one silently breaks
  # scraping. To require a token instead, set METRICS_TOKEN here and give
  # Prometheus the matching credential - which means a scrape config, not an
  # annotation:
  #
  #   scrape_configs:
  #     - job_name: cortex-api
  #       kubernetes_sd_configs: [{role: pod}]
  #       authorization:
  #         type: Bearer
  #         credentials_file: /etc/prometheus/secrets/cortex/METRICS_TOKEN
  #
  # mounting the same Secret into the Prometheus pod. Doing one half of that
  # is worse than doing neither.

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cortex-api-pdb
  namespace: cortex
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cortex
      component: api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cortex-api-hpa
  namespace: cortex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cortex-api
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
