apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-api
  namespace: cortex
  labels:
    app: cortex
    component: api
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortex
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # Zero-downtime rolling update
  template:
    metadata:
      labels:
        app: cortex
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cortex-api
          image: cortex:latest
          command: ["cortex-api"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cortex-config
            - secretRef:
                name: cortex-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 60

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-worker
  namespace: cortex
  labels:
    app: cortex
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortex
      component: worker
  template:
    metadata:
      labels:
        app: cortex
        component: worker
    spec:
      containers:
        - name: cortex-worker
          image: cortex:latest
          command: ["celery", "-A", "cortex.workers.celery_app", "worker",
                    "--loglevel=info", "--concurrency=4", "-Q", "agent,ingest,eval,maintenance"]
          envFrom:
            - configMapRef:
                name: cortex-config
            - secretRef:
                name: cortex-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-beat
  namespace: cortex
spec:
  replicas: 1               # Always exactly 1 — multiple beat schedulers cause duplicate tasks
  selector:
    matchLabels:
      app: cortex
      component: beat
  template:
    metadata:
      labels:
        app: cortex
        component: beat
    spec:
      containers:
        - name: cortex-beat
          image: cortex:latest
          command: ["celery", "-A", "cortex.workers.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: cortex-config
            - secretRef:
                name: cortex-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
