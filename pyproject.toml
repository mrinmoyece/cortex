[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex"
version = "1.0.0"
description = "MCP-native enterprise agentic AI platform"
requires-python = ">=3.10"
dependencies = [
    # MCP
    "mcp>=1.3.0",
    "fastmcp>=2.0.0",

    # Orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",

    # LLM abstraction
    "litellm>=1.50.0",

    # RAG & vector store
    "qdrant-client>=1.11.0",
    "cohere>=5.0.0",
    "rank-bm25>=0.2.2",

    # Memory
    "redis[hiredis]>=5.0.0",

    # Safety
    "nemoguardrails>=0.10.0",
    # presidio-anonymizer was declared but never used: the redaction path
    # builds its own placeholders so the regex and Presidio results can be
    # merged. It also pinned cryptography<49, holding three fixed advisories
    # out of reach.
    "presidio-analyzer>=2.2.0",

    # Observability
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "arize-phoenix-otel>=0.6.0",
    "prometheus-client>=0.21.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # PyJWT rather than python-jose: python-jose pulls in `ecdsa`, which has
    # an unfixed timing-attack advisory (PYSEC-2026-1325) and no release that
    # resolves it. Cortex signs with HS256 and needs none of it.
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.12",

    # Background tasks
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",

    # Data & config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Utilities
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
    "PyYAML>=6.0.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
# Offline quality evaluation. Kept out of the runtime closure because
# neither library is needed to serve a request, both are heavy, and ragas
# in particular drags in a transitive tree (diskcache, pillow) with open
# advisories that would otherwise gate the API image. `cortex.eval` falls
# back to LLM-as-judge when they are absent - see docs/LIMITATIONS.md.
eval = [
    "ragas>=0.2.0",
    "deepeval>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    # Used by every storage test. It was undeclared, so the suite passed
    # locally (where it had been pip-installed by hand) and would have
    # failed on a clean CI runner at import time - the classic "works on my
    # machine" left in a dependency list.
    "fakeredis>=2.26.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    # Imported directly by tests. Transitive today via fastapi and the
    # metrics layer; a direct import deserves a direct declaration, or an
    # unrelated upgrade silently breaks the suite.
    "starlette>=0.41.0",
    "factory-boy>=3.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
cortex-api = "cortex.api.main:run"
cortex-mcp = "cortex.mcp.server:run"
cortex-worker = "cortex.workers.celery_app:run"

[tool.ruff]
# py310, matching requires-python. It said py311 while the package claimed
# >=3.11 and the code used `datetime.UTC`; all three now agree on 3.10, so
# the linter actually flags syntax the floor cannot run.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "S", "B", "A", "C4", "DTZ", "RUF"]
ignore = [
    "ANN401",  # `Any` is the honest type for MCP tool arguments and payloads
    "S101",    # assert is how tests assert
    "B008",    # FastAPI's `= Depends(...)` idiom; the rule predates it
    "E501",    # line length is enforced by `ruff format`, which leaves long
               # string literals alone on purpose - reflowing a prompt
               # changes what the model reads
]

[tool.ruff.lint.per-file-ignores]
# The load profile picks a random goal from a fixed list - `random` is the
# right tool for that and has nothing to do with cryptography. Locust's
# event hooks are called by the framework with untyped kwargs.
"perf/locustfile.py" = ["S311", "ANN001", "ANN003"]
# Tests get a deliberately lighter rule set. Requiring return annotations on
# every `def test_x() -> None` adds ceremony and catches nothing; hardcoded
# credentials in fixtures are the point of the fixture.
"tests/**" = ["ANN", "S105", "S106", "S108", "SLF001", "N802"]
# The audit script shells out to pip with a fixed argument list; there is no
# untrusted input to check for.
"scripts/audit.py" = ["S603"]
# `load_dotenv()` has to run before cortex.config is imported, which is the
# one place an import genuinely cannot be at the top of the file.
"scripts/gen_token.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# Celery's `@app.task` decorator is untyped, so strict mode declares every
# task function untyped by association. Narrowing the exemption to the one
# module that defines tasks keeps the rest of the codebase strict.
[[tool.mypy.overrides]]
module = "cortex.workers.celery_app"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
# `perf` is a top-level package alongside `src`, so the gate's own tests can
# import it. A performance gate that is not itself tested is a badge.
pythonpath = [".", "src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/cortex --cov-report=term-missing --cov-fail-under=80"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]
