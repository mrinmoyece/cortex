global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: cortex
    environment: local

# Mounted from obs/alerts.yaml by docker-compose.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cortex-api
    static_configs:
      - targets: ["cortex-api:8000"]
    metrics_path: /metrics
    scrape_interval: 10s
    # /metrics is unauthenticated unless METRICS_TOKEN is set. If you set it,
    # uncomment this and mount the same value as a file, otherwise every
    # scrape returns 401 and the dashboards go blank without warning.
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token

  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
