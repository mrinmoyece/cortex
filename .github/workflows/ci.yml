name: CI

on:
  push: { branches: [main] }
  pull_request:

# Least privilege by default; the one job that needs more asks for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the package declares; 3.13 catches deprecations
        # early. The floor is tested because `datetime.UTC` once made the
        # whole package silently 3.11-only while claiming otherwise.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests perf
          ruff format --check src tests perf

      - name: Type check
        # No longer advisory. The 83 strict-mode errors this was hiding are
        # fixed, so a regression fails the build instead of scrolling past.
        run: mypy src

      - name: Tests and coverage gate
        # No `|| true`. The gate is 80% and it is allowed to fail the build;
        # a quality gate that cannot fail is a badge.
        run: pytest --cov=src/cortex --cov-report=xml --cov-fail-under=80

      - name: Import check with a clean environment
        # The suite could not even be COLLECTED for most of this project's
        # life, because sixteen modules built Settings at import time and
        # SECRET_KEY is unset on a clean machine. This step fails if that
        # coupling ever returns.
        env: {}
        run: python -c "import cortex.api.main, cortex.mcp.server, cortex.workers.celery_app"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[dev]" pip-audit bandit
      - name: Dependency audit
        # Scoped to Cortex's own dependency closure. Plain `pip-audit
        # --strict` audits the whole environment, so it fails on anything
        # else the runner happens to have installed and aborts outright on
        # editable installs it cannot resolve. No `|| true`: a real advisory
        # gets a dated, justified entry in audit-ignore.toml or it gets fixed.
        run: python scripts/audit.py --extra dev
      - name: Static security analysis
        run: bandit -r src -ll

  codeql:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: python }
      - uses: github/codeql-action/analyze@v3

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Edge latency budgets
        # Exits non-zero on a breach. Budgets cover the request edge only -
        # agent runs are provider-bound and would make this flaky rather
        # than informative. See docs/PERFORMANCE.md for the reasoning.
        run: python -m perf.benchmark --concurrency 6 --iterations 25
